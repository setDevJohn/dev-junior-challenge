services:
  mock-service:
    build: ./mock-service
    ports:
      - "4000:4000"

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: desafio
      POSTGRES_PASSWORD: desafio
      POSTGRES_DB: checkin
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  api:
    build: ./api
    environment:
      CADASTRO_URL: http://mock-service:4000
      DATABASE_URL: postgres://desafio:desafio@db:5432/checkin
    ports:
      - "3000:3000"
    depends_on:
      - mock-service
      - db

  app:
    build: ./app
    environment:
      VITE_API_URL: http://localhost:3000
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  db_data:
